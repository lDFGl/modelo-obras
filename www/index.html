<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Auditoria Interna – Checklist de Medição de Obra</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f9;--c:#fff;--t:#1b2430;--m:#657083;--b:#dde1e8;--ac:#1f3a5f;--act:#fff;--im:#1e8e4e;--pi:#d98a00;--ni:#c62f2f;--om:#2b6fd6;--na:#8a93a3}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--c:#1b212b;--t:#e8ecf2;--m:#98a2b3;--b:#2d3644;--ac:#7fb0ff;--act:#10151c}}
:root[data-theme="dark"]{--bg:#12161c;--c:#1b212b;--t:#e8ecf2;--m:#98a2b3;--b:#2d3644;--ac:#7fb0ff;--act:#10151c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--c);border-bottom:1px solid var(--b);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:16px;margin:0;flex:1 1 200px}header small{display:block;color:var(--m);font-weight:400;font-size:12px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--b);background:var(--c);border-radius:8px;padding:7px 12px;cursor:pointer}.btn.p{background:var(--ac);color:var(--act);border-color:var(--ac)}
nav{display:flex;gap:4px;padding:10px 16px 0;overflow-x:auto}nav button{border:0;background:none;padding:8px 14px;border-bottom:3px solid transparent;cursor:pointer;color:var(--m);white-space:nowrap}nav button.on{color:var(--ac);border-color:var(--ac);font-weight:600}
main{padding:14px 16px;max-width:1150px;margin:auto}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-bottom:14px}
label.f{display:block;font-size:11px;color:var(--m)}input.i,textarea.i,select.i{width:100%;border:1px solid var(--b);background:var(--bg);border-radius:6px;padding:6px 8px}
.grid{display:grid;grid-template-columns:260px 1fr;gap:14px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px}
.list{max-height:70vh;overflow:auto;padding:4px}.it{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13px}.it.on{background:var(--bg);outline:1px solid var(--ac)}.it span.n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;font-weight:700;color:#fff;border-radius:5px;padding:2px 6px;white-space:nowrap}.tI{background:var(--im)}.tP{background:var(--pi)}.tN{background:var(--ni)}.tO{background:var(--om)}.tA{background:var(--na)}
.row{border-top:1px solid var(--b);padding:10px 0}.row.al{background:rgba(217,138,0,.07);margin:0 -6px;padding:10px 6px;border-radius:6px}
.sb{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}.sb button{border:1px solid var(--b);background:var(--c);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;font-weight:600;color:var(--m)}
.sb button.on{color:#fff;border-color:transparent}.sb .I.on{background:var(--im)}.sb .P.on{background:var(--pi)}.sb .N.on{background:var(--ni)}.sb .O.on{background:var(--om)}.sb .A.on{background:var(--na)}
.w{font-size:11px;color:var(--m)}.big{font-size:26px;font-weight:700}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid var(--b);padding:6px 8px;text-align:left;vertical-align:top}th{background:var(--bg)}.sc{overflow-x:auto}
.kpi{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.kpi div{flex:1 1 130px}.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.photo{position:relative;width:118px;height:92px;border:1px solid var(--b);border-radius:8px;overflow:hidden;background:var(--bg)}.photo img{width:100%;height:100%;object-fit:cover}.photo button{position:absolute;top:3px;right:3px;border:0;border-radius:50%;width:22px;height:22px;background:rgba(0,0,0,.7);color:#fff;cursor:pointer}.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ac);color:var(--act);padding:9px 16px;border-radius:8px;z-index:9}
</style></head><body>

 de obras e serviços representa o momento crítico de realização financeira e operacional dentro da execução de um empreendimento. O ateste físico e documental dessas medições não é uma mera formalidade administrativa, mas sim a principal salvaguarda corporativa que garante que os desembolsos financeiros sejam estritamente proporcionais ao avanço real do projeto. Em empreendimentos de alta materialidade e complexidade, assegurar que cada real pago reflita uma entrega tangível, com qualidade e dentro do escopo previamente acordado, é essencial para proteger o capital da companhia e sustentar a viabilidade econômico-financeira da obra."], ["p", "Um ambiente de controles internos eficiente sobre o fluxo mensal de pagamentos a empreiteiros, constitui a espinha dorsal da governança na engenharia. Processos maduros exigem uma \"Fonte Única da Verdade\", tipicamente centralizada no sistema ERP, onde orçamentos, contratos e medições convergem. A ausência de coesão e automação nesse fluxo expõe a organização a riscos severos, como o superfaturamento, pagamentos em duplicidade, adiantamentos disfarçados ou a execução de serviços extracontratuais não autorizado. Tais falhas têm o potencial de corroer silenciosamente a margem de lucro do empreendimento e distorcer a curva físico-financeiro (Curva S) reportada à alta administração."], ["p", "Sob a ótica das estruturas de gestão de riscos (como o COSO ERM e a ISO 31000), o controle efetivo desses desembolsos requer a aplicação rigorosa do princípio da Segregação de Funções e de alçadas de aprovação sistêmicas. O ateste técnico realizado em campo pela engenharia deve ser independente da validação contratual feita pela controladoria/suprimentos e da liquidação executada pelo financeiro. Quando essas camadas de defesa operam de forma harmônica e integrada, a companhia não apenas mitiga vulnerabilidades a fraudes e erros, mas também garante que eventuais adendos e pleitos contratuais passem pelo devido rito de governança antes de gerarem passivos irrecuperáveis."], ["p", "Nesse sentido, a presente auditoria interna foi planejada para avaliar a maturidade e a integridade do ambiente de controles aplicável ao fluxo de medições. A metodologia adotada consistiu no cruzamento analítico entre as evidências físicas e documentais, incluindo os boletins de medição assinados, os controles operacionais mantidos em planilhas de resumo e os registros extraídos do sistema ERP. O trabalho teve como objetivo avaliar a fidedignidade dos pagamentos realizados no período e apresentar recomendações para o fortalecimento dos controles, a aderência às normas de compliance e a preservação dos recursos investidos pela companhia."]], "2": [["p", "No Brasil, a validação, fiscalização e quitação do fluxo de medições de obras de civil e montagem eletromecânica estão sujeitas a um arcabouço normativo multidisciplinar (civil, trabalhista, tributário, societário e técnico). A observância dessas normas é requisito indispensável para assegurar a fidedignidade das demonstrações financeiras, prevenir passivos ocultos e garantir a eficácia dos controles internos."], ["p", "Abaixo, detalham-se os pilares legais e regulatórios que fundamentam o escopo deste trabalho:"], ["h", "Código Civil Brasileiro (Lei nº 10.406/2002) --- Regramento das Empreitadas"], ["b", "Artigos 610 a 626: Regulam os contratos de empreitada de misto e de lavor."], ["b", "Artigo 614: Constitui o marco legal primário da medição. Estabelece que, nas obras fracionadas ou por medida, o empreiteiro tem o direito de exigir a medição do que foi executado. O § 1º e § 2º preceituam que os serviços medidos se presumem verificados e aceitos caso não haja impugnação formal pelo dono da obra no prazo legal (30 dias), fundamentando a obrigatoriedade do ateste formal antes da emissão do boletim de medição."], ["h", "Consolidação das Leis do Trabalho (CLT) e Lei nº 6.019/1974 --- Responsabilidade Trabalhista em Subempreiteiras"], ["b", "Artigo 455 da CLT: Estabelece a responsabilidade direta e solidária/subsidiária do empreiteiro principal pelas obrigações trabalhistas não adimplidas pelos subempreiteiros contratados."], ["b", "Lei nº 6.019/1974 (alterada pela Lei nº 13.429/2017) e Súmula nº 331 do TST: Exigem que a tomadora de serviços exerça a fiscalização ostensiva do adimplemento das obrigações trabalhistas e previdenciárias da contratada (REFT, GFIP/FGTS, folha de pagamento), sob pena de caracterização de culpa in vigilando e responsabilização subsidiária por débitos trabalhistas."], ["h", "Legislação Tributária e Obrigações Acessórias (IN RFB nº 2.110/2022, LC nº 116/2003 e EFD-Reinf)"], ["b", "Instrução Normativa RFB nº 2.110/2022: Disciplina a retenção da contribuição previdenciária (11% ou 3,5% na desoneração da folha) sobre o valor bruto da medição/nota fiscal de empreitada/cessão de mão de obra."], ["b", "EFD-Reinf / DCTFWeb: Exige a prestação de informações do evento R-2010 (Tomador de Serviços) com base nos boletins de medição e notas fiscais validados no período, vinculando a conformidade da medição ao cumprimento de prazos fiscais federais."], ["b", "Lei Complementar nº 116/2003 (Art. 3º, III e VII): Estabelece a retenção na fonte do Imposto Sobre Serviços de Qualquer Natureza (ISSQN) no município de execução da obra (alíquotas de 2% a 5%), exigindo rigor na identificação do local de prestação do serviço no sistema ERP."], ["h", "Lei Anticorrupção e Governança Corporativa (Lei nº 12.846/2013 e Decreto nº 11.129/2022)"], ["b", "Exigem a implementação de controles internos efetivos e programas de integridade sobre a cadeia de suprimentos e pagamentos a terceiros. A ausência de liquidação e de medições físicas auditáveis expõe a companhia a riscos de pagamentos indevidos, sobrepreço e não conformidades em programas de compliance (GRC)."], ["h", "Lei das Sociedades por Ações (Lei nº 6.404/1976)"], ["b", "Artigo 177: Impõe a escrituração contábil fidedigna e a manutenção de controles que reflitam com exatidão a posição financeira e os compromissos assumidos. Divergências entre contratos, medições físicas e o sistema ERP comprometem a integridade das demonstrações financeiras."], ["h", "Normas Técnicas e Programas de Qualidade (PBQP-H e ABNT NBR 12721)"], ["b", "PBQP-H (SiAC): Exige procedimentos padronizados e rastreabilidade entre a qualificação do fornecedor, a execução física em canteiro e a aprovação financeira do serviço."], ["b", "ABNT NBR 12721: Define os critérios para orçamentação e discriminação de custos na construção civil, sustentando a necessidade de alinhamento das medições com a estrutura analítica do orçamento do empreendimento."]], "3": [["p", "Em cumprimento aos requisitos do CFC n° 986/2003 NBC TI 01, os trabalhos de auditoria interna compreenderam o planejamento, a execução dos procedimentos, a análise das evidências, o registro das constatações e a formação de conclusão sobre a adequação e a efetividade dos controles internos, da gestão de riscos e da governança relacionados ao processo de medição de obras no período examinado, correspondente a setembro de 2026."], ["p", "Nesse sentido, este relatório de auditoria interna foi elaborado segundo o cronograma de auditorias para o ciclo 2025/2026 e é específico sobre os processos de Medição de Obras, sendo de uso exclusivo da alta administração do grupo FG Empreendimentos."], ["p", "Os trabalhos foram fundamentados na documentação elaborada e disponibilizada pelo setor auditado, na consulta aos registros do sistema ERP e na visita presencial à obra, abrangendo os seguintes aspectos:"], ["b", "Definição de papéis e responsabilidades;"], ["b", "Identificação de normas, políticas e procedimentos internos;"], ["b", "Controles internos adotados;"], ["b", "Registro e monitoramento das informações;"], ["b", "Entrevistas e Comunicação internas;"], ["b", "Análise da documentação disponibilizada;"], ["b", "Avaliação da conformidade;"], ["b", "Apresentação dos pontos de melhorias e recomendações; e"], ["b", "Acompanhamento das recomendações/follow-up (caso haja desvios encontrados neste relatório)."], ["p", "Para cada aspecto examinado, será avaliado o Nível de Conformidade das evidências em relação aos critérios aplicáveis, considerando a aderência às políticas, aos procedimentos internos e aos demais requisitos definidos para o processo. Para essa avaliação, serão utilizadas as classificações apresentadas a seguir:"], ["p", "Concluída a avaliação final dos testes, deve-se calcular o resultado individual de cada análise, por meio de média ponderada dos resultados, conforme método de cálculo abaixo:"], ["p", "Para os itens que constarem (OM) no nível de conformidade, entende-se que o item avaliado está implementado (IM). O teste poderá ser classificado no (NA) caso as informações relacionadas não sejam vinculadas a aquela atividade."], ["p", "O Nível de Conformidade indica o grau de segurança que o prestador de serviços (setor auditado) é capaz de gerar informações confiáveis. É uma medida da efetividade dos controles internos e da capacidade da organização em atender aos seus próprios padrões e aos requisitos internos."]], "6": [["p", "Os testes realizados pela auditoria interna são fundamentais para verificar, com base em evidências, se os controles internos estão funcionando de forma eficaz e se os processos seguem as normas, políticas e objetivos da organização. Eles permitem identificar falhas, riscos e oportunidades de melhoria de forma prática e objetiva, contribuindo para a confiabilidade das informações, a prevenção de fraudes e o fortalecimento da governança corporativa. Além disso, são a base para que as conclusões e recomendações do auditor tenham respaldo técnico e credibilidade perante a alta gestão."], ["b", "Avaliar se os procedimentos sistêmicos, instruções de trabalho e formulários da FG estão sendo utilizados nas atividades do setor;"], ["b", "Verificar se a documentação carregada atende as diretrizes da FG, as responsabilidades, a descrição das atividades e aprovações;"], ["b", "Verificar a rastreabilidade documental dos processos do setor, desde a solicitação inicial até o acompanhamento final da entrega documental;"], ["b", "Verificar se as cópias documentais (cadastros, fiscais, trabalhistas, técnicos e societários) estão devidamente arquivadas e atualizadas;"], ["b", "Avaliar se os controles internos do setor são eficazes e atendem à demanda da empresa;"], ["b", "Analisar se há aderência das atividades do setor em confronto com o organograma e fluxograma do setor;"], ["b", "Verificar se os contratos e adendos estão devidamente registrados no sistema ERP e diretórios;"], ["b", "Verificar se os adendos de valor e prazos estão condizentes com o objeto contratual;"], ["b", "Verificar nos casos de distrato, se houve os devidos descontos de medições já pagas; e"], ["b", "Avaliar se há indícios de fraudes nos processos do setor que possam ter gerado prejuízos a FG."]]};

try{S=JSON.parse(localStorage.getItem('aud1'))}catch(e){}S=S||seed();S.m=Object.assign({sec4:'',sec5:'',sec6:'',lim:'',imgs:[]},S.m||{});S.m.imgs=Array.isArray(S.m.imgs)?S.m.imgs:[];S.c=(S.c||[]).map(c=>Object.assign({o:{},ac:{},imgs:[]},c,{o:c.o||{},ac:c.ac||{},imgs:Array.isArray(c.imgs)?c.imgs:[]}));S.p=S.p||{};
