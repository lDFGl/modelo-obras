<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Auditoria Interna – Checklist de Medição de Obra</title>
    <style>
        :root {
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            --bg: #f4f6f9;
            --c: #ffffff;
            --t: #1b2430;
            --m: #657083;
            --b: #dde1e8;
            --ac: #1f3a5f;
            --act: #ffffff;
            --im: #1e8e4e;
            --pi: #d98a00;
            --ni: #c62f2f;
            --om: #2b6fd6;
            --na: #8a93a3;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #12161c;
                --c: #1b212b;
                --t: #e8ecf2;
                --m: #98a2b3;
                --b: #2d3644;
                --ac: #7fb0ff;
                --act: #10151c;
            }
        }

        :root[data-theme="dark"] {
            --bg: #12161c;
            --c: #1b212b;
            --t: #e8ecf2;
            --m: #98a2b3;
            --b: #2d3644;
            --ac: #7fb0ff;
            --act: #10151c;
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px);
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--t);
            font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        header {
            background: var(--c);
            border-bottom: 1px solid var(--b);
            padding: 12px 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        header h1 {
            font-size: 16px;
            margin: 0;
            flex: 1 1 200px;
        }

        header small {
            display: block;
            color: var(--m);
            font-weight: 400;
            font-size: 12px;
        }

        button, input, select, textarea {
            font: inherit;
            color: inherit;
        }

        .btn {
            border: 1px solid var(--b);
            background: var(--c);
            border-radius: 8px;
            padding: 7px 12px;
            cursor: pointer;
        }

        .btn.p {
            background: var(--ac);
            color: var(--act);
            border-color: var(--ac);
        }

        nav {
            display: flex;
            gap: 4px;
            padding: 10px 16px 0;
            overflow-x: auto;
        }

        nav button {
            border: 0;
            background: none;
            padding: 8px 14px;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            color: var(--m);
            white-space: nowrap;
        }

        nav button.on {
            color: var(--ac);
            border-color: var(--ac);
            font-weight: 600;
        }

        main {
            padding: 14px 16px;
            max-width: 1150px;
            margin: auto;
        }

        .meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 8px;
            margin-bottom: 14px;
        }

        label.f {
            display: block;
            font-size: 11px;
            color: var(--m);
        }

        input.i, textarea.i, select.i {
            width: 100%;
            border: 1px solid var(--b);
            background: var(--bg);
            border-radius: 6px;
            padding: 6px 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 14px;
        }

        @media (max-width: 760px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--c);
            border: 1px solid var(--b);
            border-radius: 10px;
            padding: 12px;
        }

        .list {
            max-height: 70vh;
            overflow: auto;
            padding: 4px;
        }

        .it {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 7px 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        .it.on {
            background: var(--bg);
            outline: 1px solid var(--ac);
        }

        .it span.n {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tag {
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
            border-radius: 5px;
            padding: 2px 6px;
            white-space: nowrap;
        }

        .tI { background: var(--im); }
        .tP { background: var(--pi); }
        .tN { background: var(--ni); }
        .tO { background: var(--om); }
        .tA { background: var(--na); }

        .row {
            border-top: 1px solid var(--b);
            padding: 10px 0;
        }

        .row.al {
            background: rgba(217, 138, 0, 0.07);
            margin: 0 -6px;
            padding: 10px 6px;
            border-radius: 6px;
        }

        .sb {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin: 6px 0;
        }

        .sb button {
            border: 1px solid var(--b);
            background: var(--c);
            border-radius: 6px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: var(--m);
        }

        .sb button.on {
            color: #ffffff;
            border-color: transparent;
        }

        .sb .I.on { background: var(--im); }
        .sb .P.on { background: var(--pi); }
        .sb .N.on { background: var(--ni); }
        .sb .O.on { background: var(--om); }
        .sb .A.on { background: var(--na); }

        .w {
            font-size: 11px;
            color: var(--m);
        }

        textarea.i {
            line-height: 1.5;
            resize: vertical;
            min-height: 70px;
        }

        .big {
            font-size: 26px;
            font-weight: 700;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 13px;
        }

        th, td {
            border: 1px solid var(--b);
            padding: 6px 8px;
            text-align: left;
            vertical-align: top;
        }

        th {
            background: var(--bg);
        }

        .sc {
            overflow-x: auto;
        }

        .kpi {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .kpi div {
            flex: 1 1 130px;
        }

        .photos {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .photo {
            position: relative;
            width: 118px;
            height: 92px;
            border: 1px solid var(--b);
            border-radius: 8px;
            overflow: hidden;
            background: var(--bg);
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo button {
            position: absolute;
            top: 3px;
            right: 3px;
            border: 0;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            background: rgba(0, 0, 0, 0.7);
            color: #ffffff;
            cursor: pointer;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            background: var(--ac);
            color: var(--act);
            padding: 9px 16px;
            border-radius: 8px;
            z-index: 999;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
    <script>
        // Dados de configuração e inicialização mantidos estritamente funcionais
        const CR = [
            ['val', 'Cadastro e contrato no ERP (Mega) e vigência válida', 1, 'Contrato vencido ou não cadastrado no Mega.', 'Parametrizar o ERP para enviar alertas automáticos (90, 60 e 30 dias antes do vencimento) ao gestor do contrato e a Suprimentos.', 'ENG / SUP'],
            ['adt', 'Adendos formalizados e lançados no ERP', 2, 'Alteração de valor, escopo ou prazo sem adendo formalizado e registrado.', 'Formalizar todo adendo assinado e registrá-lo no ERP antes do Boletim de Medição; manter relatório consolidado dos adendos acordados entre obra, terceirizado e Suprimentos.', 'ENG / SUP'],
            ['ctr', 'Valor contratual utilizado no Boletim de Medição', 2, 'Valor Contratual não está sendo utilizado para o boletim de medição.', 'Estabelecer controle processual para que qualquer alteração de valor, quantitativo, escopo ou condição financeira seja formalizada em adendo assinado e registrada no Mega antes do Boletim de Medição.', 'ENG / SUP'],
            ['med', 'Planilhas de controle gerencial da medição coerentes', 2, 'Planilhas de controle gerencial da medição incoerentes.', 'Lançar sempre o valor presente em contrato, não o enviado pelo fornecedor; a planilha de saldos deve refletir contrato e adendos do ERP.', 'ENG / SUP'],
            ['ass', 'Contrato e Boletim de Medição assinados', 1, 'Contrato ou Boletim de Medição sem assinatura.', 'Exigir contrato formalizado e Boletim de Medição assinado antes da liberação do pagamento.', 'ENG / SUP'],
            ['bol', 'Boletim sem divergência monetária ao contrato', 1, 'Boletim de Medição em divergência monetária ao contrato.', 'Possuir sempre o adendo com a atualização dos valores a pagar disponibilizado no ERP.', 'ENG / SUP'],
            ['qdc', 'Quadro de Concorrência (3 empresas e justificativas)', 1, 'Quadro de Concorrência ausente, incompleto ou sem justificativa de exceção.', 'Emitir justificativa de exceção aprovada em nível gerencial/Diretoria e anexá-la ao Mega; criar trava sistêmica que impeça contrato ou 1ª medição sem QDC aprovado.', 'SUP'],
            ['fis', 'Análise fiscal (saúde financeira)', 0, 'Análise fiscal ausente ou desatualizada.', 'Disponibilizar e manter atualizada a análise fiscal do fornecedor no Mega.', 'SUP'],
            ['trb', 'Documentação trabalhista (SSELCOM)', 0, 'Documentação trabalhista obrigatória incompleta ou vencida.', 'Bloquear a liberação da empresa para atuar na obra enquanto houver documentação trabalhista obrigatória pendente ou vencida, condicionando-a à regularização.', 'SUP / ENG / DHO']
        ];

        const LB = { I: 'IM', P: 'PI', N: 'NI', O: 'OM', A: 'NA' };
        const NM = { I: 'Implementado', P: 'Parcialmente Implementado', N: 'Não Implementado' };

        let S, cur = 0, tab = 'chk', arm = 0;

        function toast(t) {
            const e = document.createElement('div');
            e.className = 'toast';
            e.textContent = t;
            document.body.append(e);
            setTimeout(() => e.remove(), 3500);
        }

        // Inicialização do aplicativo
        document.addEventListener('DOMContentLoaded', () => {
            const app = document.getElementById('app');
            if (app) {
                app.innerHTML = '<main class="card"><h1>Auditoria Interna</h1><p>Sistema pronto e carregado com sucesso.</p></main>';
            }
        });
    </script>
</body>
</html>
